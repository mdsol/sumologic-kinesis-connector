global:
  stageName: production
  image:
    repository: "{DOCKER_IMAGE_REPOSITORY_PRODUCTION}"

worker:
  rbac:
    serviceAccount:
      roleArn: "{ROLE_ARN_PRODUCTION_WORKER}"
  externalSecret:
    enabled: true
    secrets:
      worker-secrets:
        name: "{AWS_SECRET_NAME_PRODUCTION_WORKER}"
